services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: quizgrader-app

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: quizgrader
      DB_USER: quizgrader
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: /app/backend/uploads

    volumes:
      - quizgrader_uploads:/app/backend/uploads

    depends_on:
      db:
        condition: service_healthy

    networks:
      - quizgrader-network


  db:
    image: postgres:16-alpine

    container_name: quizgrader-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: quizgrader
      POSTGRES_USER: quizgrader
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - quizgrader_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizgrader -d quizgrader"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - quizgrader-network


volumes:
  quizgrader_data:
  quizgrader_uploads:


networks:
  quizgrader-network:
    driver: bridge